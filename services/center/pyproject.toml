[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mellow-center"
version = "0.14.1"
description = "Mellow encrypted single-center developer preview"
requires-python = ">=3.11"
dependencies = ["zeroconf>=0.132,<1", "fastapi>=0.109,<1", "pydantic>=2.5,<3", "uvicorn>=0.27,<1", "httpx>=0.28,<1", "cryptography>=42,<47", "onnxruntime==1.24.4", "tokenizers==0.22.2", "numpy==2.4.6",
    "lunar-python>=1.4,<2", "trafilatura>=2,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
voice = ["faster-whisper>=1.1,<2"]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[project.scripts]
mellow-center = "mellow_center.cli:main"

[tool.setuptools.package-data]
mellow_center = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "chat-rules.json", "profile-slots.json"]
